name: Tests

on:
  push:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Docker backend tests run commands in a real container and are skipped when this image is missing.
      - name: Fetch the image for the sandbox tests
        if: runner.os == 'Linux'
        continue-on-error: true
        run: docker pull mirror.gcr.io/library/alpine:3

      - run: npm test
