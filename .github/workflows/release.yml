name: Release

# Builds the package the installer and `openhermes update` download, and publishes it as a
# GitHub release. Two ways to start it: push a tag like v0.2.0, or run it by hand from the
# Actions tab on the main branch, which creates the tag from the version in package.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Run this from the main branch, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "name=v$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: node scripts/package.mjs

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: gh release create "$TAG" release/openhermes.zip release/release.json install.ps1 uninstall.ps1 --target "$GITHUB_SHA" --title "OpenHermes $TAG" --generate-notes
